<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}DeclineDesk{% endblock %}</title>
<style>
  :root {
    --text: #1f2328; --muted: #5f6670; --line: #e3e5e8; --bg: #f6f7f8;
    --panel: #ffffff; --accent: #3b5b8c; --accent-text: #ffffff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
         Helvetica, Arial, sans-serif; color: var(--text); background: var(--bg); }
  header { background: var(--panel); border-bottom: 1px solid var(--line); }
  .bar { max-width: 960px; margin: 0 auto; padding: 12px 16px; display: flex;
         align-items: center; justify-content: space-between; gap: 12px; }
  .brand { font-weight: 600; color: var(--text); text-decoration: none; }
  main { max-width: 960px; margin: 24px auto; padding: 0 16px; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  h2 { font-size: 15px; margin: 24px 0 8px; color: var(--muted); text-transform: uppercase;
       letter-spacing: .04em; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
           padding: 16px; }
  table { width: 100%; border-collapse: collapse; background: var(--panel);
          border: 1px solid var(--line); border-radius: 6px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line);
           vertical-align: top; }
  th { font-size: 13px; color: var(--muted); font-weight: 500; }
  tr:last-child td { border-bottom: 0; }
  a { color: var(--accent); }
  .muted { color: var(--muted); }
  .label { display: inline-block; font-size: 12px; padding: 1px 8px; border: 1px solid #c9cdd2;
           border-radius: 10px; color: var(--muted); white-space: nowrap; }
  .label.attention { border-color: var(--accent); color: var(--accent); }
  .text { white-space: pre-wrap; }
  .btn { font: inherit; padding: 6px 14px; border-radius: 4px; border: 1px solid var(--accent);
         background: var(--accent); color: var(--accent-text); cursor: pointer; }
  .btn.secondary { background: var(--panel); color: var(--accent); }
  .linkbtn { font: inherit; background: none; border: 0; color: var(--accent); cursor: pointer;
             padding: 0; }
  input[type=text], select { font: inherit; padding: 6px 8px; border: 1px solid var(--line);
                             border-radius: 4px; }
  .notice { padding: 10px 12px; border: 1px solid var(--line); border-left: 3px solid
            var(--accent); background: var(--panel); margin-bottom: 16px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  @media (max-width: 640px) { th:nth-child(4), td:nth-child(4) { display: none; } }
</style>
</head>
<body>
<header><div class="bar">
  <a class="brand" href="/">DeclineDesk</a>
  {% if user %}
  <form class="row" method="post" action="/logout">
    <span class="muted">{{ user.name }}{% if user.is_admin %} (admin){% endif %}</span>
    <button class="linkbtn" type="submit">Sign out</button>
  </form>
  {% endif %}
</div></header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
