# DeclineDesk eval set: 40 support tickets on the seeded demo data, with gold answers.
#
# triage:          the correct triage output (used as the scripted model in rules mode;
#                  scored against the real model in live mode)
# model_proposes:  in rules mode, the action the scripted drafting model proposes
#                  (adversarial cases propose something the guard must refuse)
# expect:          the correct end result: status, matched authorization, causes, the
#                  final action that goes for approval, and the flags that must be raised

- id: e01
  employee: emp_maria
  text: "Hola, mi tarjeta fue rechazada en un Uber en Ciudad de Mexico. Que paso?"
  triage: {language: es, merchant: Uber, country: MX}
  expect: {status: drafted, authorization: scn_maria_uber_mx, causes: [country_restricted],
           action: {type: allow_country, card_id: card_maria, country: MX, hours: 24}}
